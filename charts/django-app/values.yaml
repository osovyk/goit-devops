image:
  # Set by Argo CD via a Helm parameter (fed from the ecr module by Terraform);
  # for manual installs pass --set image.repository=<ECR URL>.
  repository: ""
  tag: 70e2aff
  pullPolicy: IfNotPresent

service:
  type: LoadBalancer
  port: 8000

replicaCount: 2

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 70

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

# Non-sensitive settings only — rendered into the ConfigMap.
# SECRET_KEY, POSTGRES_HOST and POSTGRES_PASSWORD deliberately live in the
# "django-app-secrets" Kubernetes Secret created by Terraform (root main.tf)
# from the rds module outputs, so no credentials are stored in git.
config:
  DEBUG: "True"
  POSTGRES_PORT: "5432"
  POSTGRES_DB: "myapp"
  POSTGRES_USER: "dbadmin"
  ALLOWED_HOSTS: "*"

# Secret with SECRET_KEY / POSTGRES_HOST / POSTGRES_PASSWORD, created outside
# the chart (by Terraform). The Deployment mounts it via envFrom.
existingSecret: django-app-secrets
