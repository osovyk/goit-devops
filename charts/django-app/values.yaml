image:
  repository: 486553676459.dkr.ecr.eu-west-1.amazonaws.com/lesson-5-ecr
  tag: 84b461c
  pullPolicy: IfNotPresent

service:
  type: LoadBalancer
  port: 8000

replicaCount: 2

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 70

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

config:
  SECRET_KEY: "django-insecure-change-me-in-production"
  DEBUG: "True"
  # RDS instance provisioned by the rds module (rds_endpoint output, host part).
  # Credentials mirror rds_master_username / rds_master_password from tfvars —
  # kept in a ConfigMap to match the course setup; the instance is reachable
  # only from inside the VPC (see the rds module's security group).
  POSTGRES_HOST: "final-project-db.cl8uya0s0mcw.eu-west-1.rds.amazonaws.com"
  POSTGRES_PORT: "5432"
  POSTGRES_DB: "myapp"
  POSTGRES_USER: "dbadmin"
  POSTGRES_PASSWORD: "FinalProject2026pass"
  ALLOWED_HOSTS: "*"
