server:
  replicas: 1
  # ClusterIP on purpose: the Argo CD UI must not be exposed to the internet.
  # Access it with: kubectl port-forward svc/argocd-server 8081:443 -n argocd
  service:
    type: ClusterIP
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

repoServer:
  replicas: 1
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
